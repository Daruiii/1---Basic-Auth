<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bat-Ordinateur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/register.html">Batcave Security</a>
        <a class="nav-link" href="/auth/logout">Se déconnecter</a>
      </div>
    </nav>

    <main class="container py-4">
      <h1 id="welcome">Bienvenue, Justicier __USERNAME__</h1>

      <section class="my-4">
        <h2>Arsenal</h2>
        <div id="gadgets" class="row g-3"></div>
      </section>

      <section class="my-4">
        <h2>Rapport de mission</h2>
        <form id="report-form">
          <label for="report" class="form-label">Note</label>
          <textarea id="report" class="form-control" required></textarea>
          <button type="submit" class="btn btn-primary mt-2">
            Enregistrer
          </button>
          <p id="report-message" class="mt-2"></p>
        </form>
      </section>
    </main>

    <script>
      const loadGadgets = async () => {
        const response = await fetch('/api/secrets')
        const gadgetsContainer = document.getElementById('gadgets')

        if (!response.ok) {
          gadgetsContainer.textContent = "Impossible de charger l'arsenal."
          return
        }

        const gadgets = await response.json()
        gadgetsContainer.innerHTML = gadgets
          .map(
            gadget => `
              <article class="col-md-4">
                <div class="card h-100">
                  <div class="card-body">
                    <i class="fa-solid ${gadget.icon} fs-2 mb-3"></i>
                    <h3 class="h5">${gadget.name}</h3>
                    <p>${gadget.desc}</p>
                  </div>
                </div>
              </article>
            `
          )
          .join('')
      }

      document.getElementById('report-form').onsubmit = async event => {
        event.preventDefault()

        const messageElement = document.getElementById('report-message')
        const content = document.getElementById('report').value
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ content })
        })

        if (response.ok) {
          messageElement.style.color = 'green'
          messageElement.textContent = 'Rapport enregistré.'
          document.getElementById('report').value = ''
        } else {
          messageElement.style.color = 'red'
          messageElement.textContent = "Erreur lors de l'enregistrement."
        }
      }

      loadGadgets()
    </script>
  </body>
</html>
