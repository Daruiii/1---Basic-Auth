<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batcave Security</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <main class="container py-5" style="max-width: 560px">
      <h1>Batcave Security</h1>
      <p class="text-secondary">Choisissez votre fournisseur d’identité.</p>

      <nav class="d-grid gap-3 mt-4" aria-label="Fournisseurs d'identité">
        <a class="btn btn-outline-dark btn-lg" href="/auth/oauth/google">
          <i class="fa-brands fa-google me-2" aria-hidden="true"></i>
          Se connecter avec Google
        </a>
        <a class="btn btn-dark btn-lg" href="/auth/oauth/github">
          <i class="fa-brands fa-github me-2" aria-hidden="true"></i>
          Se connecter avec GitHub
        </a>
        <a class="btn btn-primary btn-lg" href="/auth/oauth/facebook">
          <i class="fa-brands fa-facebook me-2" aria-hidden="true"></i>
          Se connecter avec Facebook
        </a>
      </nav>
    </main>
  </body>
</html>
