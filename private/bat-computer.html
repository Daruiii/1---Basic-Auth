<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bat-Ordinateur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/register.html">Batcave Security</a>
        <a class="nav-link" href="/auth/logout">Se déconnecter</a>
      </div>
    </nav>

    <main class="container py-4">
      <h1 id="welcome">Bienvenue</h1>

      <section class="my-4">
        <h2>Arsenal</h2>
        <div id="gadgets" class="row g-3"></div>
      </section>

      <section class="my-4">
        <h2>Rapport de mission</h2>
        <form id="report-form">
          <label for="report" class="form-label">Note</label>
          <textarea id="report" class="form-control" required></textarea>
          <button type="submit" class="btn btn-primary mt-2">
            Enregistrer
          </button>
          <p id="report-message" class="mt-2"></p>
        </form>
      </section>

      <section class="my-4">
        <h2>Modifier le mot de passe</h2>
        <form id="password-form">
          <label for="current-password" class="form-label">
            Mot de passe actuel
          </label>
          <input
            id="current-password"
            type="password"
            class="form-control"
            required
          />

          <label for="new-password" class="form-label mt-2">
            Nouveau mot de passe
          </label>
          <input
            id="new-password"
            type="password"
            class="form-control"
            required
          />

          <button type="submit" class="btn btn-primary mt-2">
            Modifier
          </button>
          <p id="password-message" class="mt-2"></p>
        </form>
      </section>
    </main>

    <script src="/dashboard.js"></script>
  </body>
</html>
