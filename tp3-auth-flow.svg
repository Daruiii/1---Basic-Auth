<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8f9fa" />
  <style>
    text { font-family: Arial, sans-serif; fill: #212529; }
    .title { font-size: 28px; font-weight: 700; }
    .actor { fill: #ffffff; stroke: #212529; stroke-width: 2; }
    .actor-text { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .line { stroke: #495057; stroke-width: 2; marker-end: url(#arrow); }
    .label { font-size: 16px; }
    .step { fill: #e9ecef; stroke: #6c757d; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#495057" />
    </marker>
  </defs>

  <text x="600" y="45" class="title" text-anchor="middle">TP3 - Cycle JWT et refresh token</text>

  <rect x="40" y="85" width="220" height="60" rx="6" class="actor" />
  <text x="150" y="122" class="actor-text">Navigateur / Frontend</text>
  <rect x="340" y="85" width="220" height="60" rx="6" class="actor" />
  <text x="450" y="122" class="actor-text">Middleware JWT</text>
  <rect x="640" y="85" width="220" height="60" rx="6" class="actor" />
  <text x="750" y="122" class="actor-text">API Express</text>
  <rect x="940" y="85" width="220" height="60" rx="6" class="actor" />
  <text x="1050" y="122" class="actor-text">SQLite</text>

  <line x1="150" y1="145" x2="150" y2="710" stroke="#adb5bd" stroke-width="2" />
  <line x1="450" y1="145" x2="450" y2="710" stroke="#adb5bd" stroke-width="2" />
  <line x1="750" y1="145" x2="750" y2="710" stroke="#adb5bd" stroke-width="2" />
  <line x1="1050" y1="145" x2="1050" y2="710" stroke="#adb5bd" stroke-width="2" />

  <line x1="150" y1="200" x2="750" y2="200" class="line" />
  <text x="360" y="190" class="label">1. POST /auth/login</text>
  <line x1="750" y1="245" x2="1050" y2="245" class="line" />
  <text x="790" y="235" class="label">2. Stocke refreshToken (7 jours)</text>
  <line x1="750" y1="290" x2="150" y2="290" class="line" />
  <text x="310" y="280" class="label">3. Cookies accessToken (15 s) + refreshToken</text>

  <rect x="65" y="330" width="1070" height="60" rx="6" class="step" />
  <text x="600" y="367" class="label" text-anchor="middle">Apres 15 secondes, l'accessToken expire mais le refreshToken reste valide</text>

  <line x1="150" y1="435" x2="450" y2="435" class="line" />
  <text x="175" y="425" class="label">4. Requete API protegee</text>
  <line x1="450" y1="480" x2="150" y2="480" class="line" />
  <text x="235" y="470" class="label">5. 401 Unauthorized</text>
  <line x1="150" y1="525" x2="750" y2="525" class="line" />
  <text x="330" y="515" class="label">6. POST /api/auth/refresh automatique</text>
  <line x1="750" y1="570" x2="1050" y2="570" class="line" />
  <text x="800" y="560" class="label">7. Verifie le refreshToken</text>
  <line x1="750" y1="615" x2="150" y2="615" class="line" />
  <text x="345" y="605" class="label">8. Nouveau cookie accessToken</text>
  <line x1="150" y1="660" x2="450" y2="660" class="line" />
  <text x="180" y="650" class="label">9. Rejoue la requete initiale</text>
</svg>
