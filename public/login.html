<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-5" style="max-width: 560px">
      <h1>Connexion</h1>

      <form id="login-form">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input id="username" class="form-control" autocomplete="username" required />

        <label for="password" class="form-label mt-2">Mot de passe</label>
        <input
          id="password"
          type="password"
          class="form-control"
          autocomplete="current-password"
          required
        />

        <button type="submit" class="btn btn-primary mt-3">
          Se connecter
        </button>
        <a href="/register.html" class="btn btn-link mt-3">Créer un compte</a>
      </form>

      <section id="setup-section" class="mt-4" hidden>
        <h2 class="h4">Activer la double authentification</h2>
        <img id="qr-code" class="img-fluid" alt="QR Code 2FA" />
        <p>Clé de secours : <code id="secret"></code></p>

        <form id="setup-form">
          <label for="setup-code" class="form-label">Code à 6 chiffres</label>
          <input
            id="setup-code"
            class="form-control"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />
          <button type="submit" class="btn btn-primary mt-3">Activer</button>
        </form>
      </section>

      <section id="verify-section" class="mt-4" hidden>
        <h2 class="h4">Double authentification</h2>
        <form id="verify-form">
          <label for="verify-code" class="form-label">Code à 6 chiffres</label>
          <input
            id="verify-code"
            class="form-control"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />
          <button type="submit" class="btn btn-primary mt-3">Valider</button>
        </form>
      </section>

      <p id="message" class="mt-3" aria-live="polite"></p>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
